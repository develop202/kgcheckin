name: 仓库保活

# GitHub 会在仓库连续 60 天无提交时自动停用 schedule 触发器。
# 这里每月 3 个非整点时段各跑一次，任意一次成功即可，避免单独一次被高峰期丢弃。
on:
  schedule:
    - cron: '17 3 1 * *'
    - cron: '43 7 11 * *'
    - cron: '26 11 21 * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: 更新保活时间戳
        run: |
          mkdir -p .github
          {
            echo '# Repository Keepalive'
            echo ''
            echo '用于防止 GitHub 因长期无提交而停用 schedule 触发器。'
            echo ''
            echo "**Last Update:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "**Workflow Run:** #${{ github.run_number }}"
            echo "**Trigger:** ${{ github.event_name }}"
          } > .github/KEEPALIVE.md

      - name: 提交并推送
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/KEEPALIVE.md
          if git diff --staged --quiet; then
            echo "无变更"
          else
            git commit -m "chore: keepalive at $(date -u +'%Y-%m-%d')"
            git push
            echo "保活提交成功"
          fi
